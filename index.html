<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>商品交換会特別ルーレット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0c0410; --bg1:#1a0820; --bg2:#3d0a22; --bg3:#7a0f33;
  --gold:#ffd84d; --gold-d:#b9851a; --gold-l:#fff3c4; --gold-dd:#7a5810;
  --cream:#fff6e2; --ink:#3a1206;
  --shadow:0 14px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Zen Maru Gothic","Mochiy Pop One",sans-serif;
  color:var(--cream);
  background:
    radial-gradient(1000px 600px at 50% -10%, rgba(255,216,77,.16), transparent 55%),
    radial-gradient(800px 600px at 88% 112%, rgba(255,82,112,.26), transparent 60%),
    radial-gradient(700px 500px at 6% 50%, rgba(16,194,194,.10), transparent 60%),
    linear-gradient(165deg,var(--bg0),var(--bg1) 30%,var(--bg2) 70%,var(--bg3));
  background-attachment:fixed;
  min-height:100%;overflow-x:hidden;display:flex;justify-content:center;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.9), transparent),
    radial-gradient(2px 2px at 78% 12%, rgba(255,240,184,.9), transparent),
    radial-gradient(1.5px 1.5px at 33% 64%, rgba(255,255,255,.8), transparent),
    radial-gradient(2px 2px at 64% 78%, rgba(255,240,184,.8), transparent),
    radial-gradient(1.5px 1.5px at 88% 52%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 6% 80%, rgba(255,255,255,.7), transparent);
  animation:tw 3.2s ease-in-out infinite alternate;
}
@keyframes tw{from{opacity:.3}to{opacity:.95}}

.app{position:relative;z-index:1;width:100%;max-width:480px;padding:14px 14px 46px}

/* BANNER */
.banner{
  position:relative;border-radius:24px;overflow:hidden;cursor:pointer;user-select:none;
  box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.08);
  border:3px solid transparent;
  background:linear-gradient(#150616,#150616) padding-box,
             linear-gradient(135deg,var(--gold-l),var(--gold-d) 50%,var(--gold-l)) border-box;
}
.banner svg{display:block;width:100%;height:auto}
.sample-badge{position:absolute;top:10px;right:10px;z-index:3;background:rgba(0,0,0,.55);color:#fff;
  border:1.5px solid rgba(255,255,255,.6);font-size:11px;letter-spacing:.5px;padding:4px 9px;border-radius:999px;font-weight:700}

/* WHEEL */
.wheel-wrap{position:relative;margin:30px auto 8px;width:min(86vw,400px);aspect-ratio:1}
.aura{position:absolute;inset:-12%;border-radius:50%;z-index:0;filter:blur(22px);opacity:.6;
  background:conic-gradient(from 0deg,#ffd84d,#ff5170,#10c2c2,#7c5cfc,#2bb673,#ff8c1a,#ffd84d);
  animation:spinAura 9s linear infinite}
@keyframes spinAura{to{transform:rotate(360deg)}}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:7;width:60px;height:70px;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.6))}
.wheel-ring{position:absolute;inset:-3%;border-radius:50%;z-index:1;
  background:conic-gradient(#fff3c4,#b9851a 12%,#fff3c4 25%,#7a5810 38%,#ffe98c 50%,#b9851a 63%,#fff3c4 75%,#7a5810 88%,#fff3c4);
  box-shadow:0 0 0 3px #2b0712,0 20px 55px rgba(0,0,0,.6),inset 0 0 18px rgba(0,0,0,.4)}
#wheel{width:100%;height:100%;border-radius:50%;display:block;position:relative;z-index:2;
  transition:transform 5.6s cubic-bezier(.12,.62,.16,1)}
.gloss{position:absolute;inset:0;border-radius:50%;z-index:4;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -8%, rgba(255,255,255,.55), rgba(255,255,255,.12) 30%, transparent 52%),
            radial-gradient(80% 60% at 50% 116%, rgba(0,0,0,.30), transparent 55%);
  mix-blend-mode:screen}
.studs{position:absolute;inset:0;z-index:5;pointer-events:none}
.stud{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 55%,var(--gold-dd));
  box-shadow:0 0 9px rgba(255,216,77,.9),0 1px 2px rgba(0,0,0,.5)}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff,var(--gold-l) 30%,var(--gold) 60%,var(--gold-d));
  border:4px solid #fff;box-shadow:0 5px 16px rgba(0,0,0,.6),inset 0 -4px 8px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center}
.hub::before{content:"";position:absolute;inset:8px;border-radius:50%;border:2px dashed rgba(122,88,16,.5)}
.hub span{font-family:"Dela Gothic One";font-size:24px;color:#b81d3e;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.6)}

/* BUTTON */
.spin-btn{display:block;margin:22px auto 6px;border:none;cursor:pointer;position:relative;overflow:hidden;
  font-family:"Dela Gothic One";font-size:23px;letter-spacing:1px;color:#7a0f29;padding:18px 56px;border-radius:999px;
  background:linear-gradient(180deg,var(--gold-l),var(--gold) 45%,var(--gold-d));
  box-shadow:0 8px 0 #8a6410,0 16px 26px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.7);transition:transform .08s,box-shadow .08s}
.spin-btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg);animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-60%}80%,100%{left:130%}}
.spin-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #8a6410,0 6px 12px rgba(0,0,0,.4)}
.spin-btn:disabled{filter:grayscale(.5) brightness(.85);cursor:not-allowed}
.spin-btn:disabled::after{display:none}
.spin-hint{text-align:center;font-size:12.5px;color:#ffe3a8;opacity:.8;margin-top:4px;letter-spacing:1px}
.sound-toggle{display:flex;align-items:center;gap:7px;margin:14px auto 0;padding:8px 16px;border-radius:999px;
  border:1.5px solid rgba(255,216,77,.5);background:rgba(20,6,16,.6);color:var(--gold-l);
  font-family:"Zen Maru Gothic";font-weight:700;font-size:12.5px;cursor:pointer;transition:transform .08s}
.sound-toggle svg{width:18px;height:18px;fill:currentColor}
.sound-toggle:active{transform:scale(.95)}
.sound-toggle.off{color:#b79;border-color:rgba(255,180,200,.35)}

/* LEGEND */
.legend{margin:28px auto 0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.28));
  border:1.5px solid rgba(255,216,77,.45);border-radius:18px;padding:15px 14px 7px;backdrop-filter:blur(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.legend h3{font-family:"Dela Gothic One";font-size:15px;text-align:center;color:var(--gold);margin-bottom:13px;letter-spacing:1px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.lrow{display:flex;align-items:center;gap:11px;padding:10px 9px;border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}
.dot{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-family:"Dela Gothic One";font-size:13px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.4)}
.lname{font-weight:700;font-size:15px;flex:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.lprob{font-family:"Dela Gothic One";font-size:13px;color:#2b0712;background:linear-gradient(180deg,var(--gold-l),var(--gold-d));
  padding:4px 11px;border-radius:999px;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}

/* OVERLAY */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(6,1,5,.8);backdrop-filter:blur(5px);padding:20px}
.overlay.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* RESULT */
.result-card{width:100%;max-width:360px;border-radius:26px;text-align:center;position:relative;
  background:linear-gradient(180deg,#fff,var(--cream));color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.7);overflow:hidden;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.rc-top{padding:22px 20px 14px;color:#fff;position:relative}
.rc-grade{font-family:"Dela Gothic One";font-size:36px;letter-spacing:2px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.rc-sub{font-size:14px;font-weight:700;margin-top:4px;opacity:.95}
.rc-medal{width:100px;height:100px;margin:8px auto -4px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.rc-body{padding:8px 22px 8px}
.rc-label{font-size:13px;color:#9a6a3a;font-weight:700;letter-spacing:1px}
.rc-prize{font-family:"Dela Gothic One";font-size:25px;margin:6px 0 4px;line-height:1.25;word-break:break-word}
.rc-close{margin:14px auto 22px;border:none;cursor:pointer;font-family:"Dela Gothic One";font-size:17px;color:#fff;padding:13px 42px;border-radius:999px;
  background:linear-gradient(180deg,#ff789a,#e11d48);box-shadow:0 5px 0 #9c0f30}
.rc-close:active{transform:translateY(4px);box-shadow:0 1px 0 #9c0f30}

/* ADMIN */
.admin-card{width:100%;max-width:430px;max-height:92vh;overflow:auto;border-radius:22px;
  background:linear-gradient(180deg,#1c0c14,#2b0712);border:2px solid var(--gold-d);box-shadow:0 24px 60px rgba(0,0,0,.75);padding:22px 18px}
.admin-card h2{font-family:"Dela Gothic One";font-size:19px;color:var(--gold);text-align:center;margin-bottom:3px}
.admin-card .ahint{text-align:center;font-size:12px;color:#d79;opacity:.9;margin-bottom:14px;line-height:1.5}
.asec-title{font-family:"Dela Gothic One";font-size:13px;color:var(--gold-l);letter-spacing:1px;margin:6px 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(255,216,77,.25)}
.afield{margin-bottom:11px}
.afield .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.afield .tag{font-family:"Dela Gothic One";font-size:11px;padding:3px 9px;border-radius:6px}
.afield .lab{font-weight:700;font-size:12.5px;color:#fff}
.afield .opt{font-size:10.5px;color:#caa;margin-left:auto;opacity:.8}
.arow{display:flex;gap:8px}
.arow input.name{flex:1;min-width:0}
.afield input{padding:11px 13px;border-radius:11px;border:1.5px solid rgba(255,216,77,.4);background:rgba(255,255,255,.96);
  color:#2b0712;font-family:"Zen Maru Gothic";font-weight:700;font-size:15px}
.afield input.prob{width:74px;text-align:center;flex:0 0 auto;font-family:"Dela Gothic One";font-size:15px}
.afield input:focus{outline:none;border-color:var(--gold)}
.afield.inactive input{opacity:.55}
.prob-wrap{position:relative;flex:0 0 auto}
.prob-wrap::after{content:"%";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#9a6a3a;font-weight:700;font-size:13px;pointer-events:none}
.total-line{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 2px;font-family:"Dela Gothic One";font-size:13px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06)}
.total-line .v{font-size:16px}
.total-line.ok .v{color:#7be36b}.total-line.ng .v{color:#ff8a8a}

.counts{margin-top:8px;border:1px solid rgba(255,216,77,.3);border-radius:12px;overflow:hidden}
.crow{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.crow:last-child{border-bottom:none}
.crow .cg{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;color:#fff}
.crow .cg .tag{font-family:"Dela Gothic One";font-size:10px;padding:2px 7px;border-radius:5px}
.crow .cn{font-family:"Dela Gothic One";font-size:17px;color:var(--gold-l);white-space:nowrap}
.crow .cn small{font-size:11px;color:#bba;margin-left:2px}
.crow.total{background:rgba(255,216,77,.12)}
.crow.total .cg{color:var(--gold)}
.crow.empty{justify-content:center;color:#a88;font-size:13px}

.abtns{display:flex;gap:10px;margin-top:14px}
.abtns button{flex:1;border:none;cursor:pointer;font-family:"Dela Gothic One";font-size:15px;padding:14px;border-radius:12px}
.asave{background:linear-gradient(180deg,var(--gold-l),var(--gold-d));color:#2b0712;box-shadow:0 4px 0 #7a5a10}
.asave:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5a10}
.aghost{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.3)!important}
.csv-btns{display:flex;gap:10px;margin-top:10px}
.acsv{flex:1;background:linear-gradient(180deg,#3fd07a,#1f9e54);color:#06351c;box-shadow:0 4px 0 #15733c;
  border:none;cursor:pointer;font-family:"Dela Gothic One";font-size:14px;padding:13px;border-radius:12px}
.acsv:active{transform:translateY(3px);box-shadow:0 1px 0 #15733c}
.acount-reset{flex:1;background:rgba(255,90,90,.14);color:#ffb3b3;border:1.5px solid rgba(255,120,120,.4)!important;
  cursor:pointer;border-radius:12px;font-family:"Dela Gothic One";font-size:13px;padding:13px}
.aclose{background:transparent;color:#ffb;text-decoration:underline;display:block;margin:16px auto 0;border:none;cursor:pointer;font-size:13px}
.saved-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:99;font-family:"Dela Gothic One";font-size:14px;
  padding:13px 26px;border-radius:999px;box-shadow:var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90vw}
.saved-toast.show{opacity:1}
.saved-toast.ok{background:var(--gold);color:#2b0712}
.saved-toast.err{background:#e11d48;color:#fff}

.confetti{position:fixed;top:-12px;width:10px;height:16px;z-index:60;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body>
<div class="app">

  <!-- BANNER (tap 5x for admin) -->
  <div class="banner" id="banner">
    <span class="sample-badge">SAMPLE</span>
    <svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0a1c"/><stop offset=".55" stop-color="#7a0f33"/><stop offset="1" stop-color="#b81d3e"/></linearGradient>
        <linearGradient id="bgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#ffd84d"/><stop offset="1" stop-color="#b9851a"/></linearGradient>
        <radialGradient id="bglow" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffe98c" stop-opacity=".85"/><stop offset="1" stop-color="#ffe98c" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="480" height="250" fill="url(#bsky)"/>
      <circle cx="240" cy="100" r="160" fill="url(#bglow)"/>
      <g opacity=".22" fill="#fff">
        <polygon points="240,100 205,-50 275,-50"/><polygon points="240,100 95,30 160,-35"/>
        <polygon points="240,100 385,30 320,-35"/><polygon points="240,100 20,120 60,30"/><polygon points="240,100 460,120 420,30"/>
      </g>
      <g>
        <circle cx="40" cy="40" r="6" fill="#5fe6e6"/><rect x="420" y="28" width="11" height="11" rx="2" fill="#ffd84d" transform="rotate(20 425 33)"/>
        <circle cx="70" cy="205" r="5" fill="#ffd84d"/><rect x="402" y="192" width="10" height="10" rx="2" fill="#5fe6e6" transform="rotate(35 407 197)"/>
        <circle cx="448" cy="150" r="5" fill="#fff"/><circle cx="22" cy="120" r="4" fill="#fff"/>
        <circle cx="120" cy="22" r="4" fill="#ff8c1a"/><circle cx="360" cy="218" r="4" fill="#7c5cfc"/>
      </g>
      <g transform="translate(68,152)">
        <ellipse cx="0" cy="58" rx="46" ry="9" fill="rgba(0,0,0,.22)"/>
        <rect x="-40" y="-12" width="80" height="62" rx="8" fill="#ff8c1a"/><rect x="-40" y="-12" width="80" height="22" rx="8" fill="#ffb347"/>
        <rect x="-46" y="-26" width="92" height="20" rx="6" fill="#ffd84d"/><rect x="-7" y="-26" width="14" height="76" fill="#e11d48"/>
        <path d="M0,-26 C-22,-50 -44,-30 -6,-26 M0,-26 C22,-50 44,-30 6,-26" fill="none" stroke="#e11d48" stroke-width="9" stroke-linecap="round"/>
        <circle cx="-12" cy="16" r="4.8" fill="#fff"/><circle cx="12" cy="16" r="4.8" fill="#fff"/>
        <circle cx="-12" cy="17" r="2.3" fill="#3a1206"/><circle cx="12" cy="17" r="2.3" fill="#3a1206"/>
        <path d="M-9,28 Q0,36 9,28" fill="none" stroke="#3a1206" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="-20" cy="24" r="4" fill="#ff5170" opacity=".55"/><circle cx="20" cy="24" r="4" fill="#ff5170" opacity=".55"/>
      </g>
      <g transform="translate(412,160)">
        <ellipse cx="0" cy="50" rx="34" ry="7" fill="rgba(0,0,0,.22)"/>
        <path d="M-22,-30 h44 v8 a22 22 0 0 1 -44 0 z" fill="url(#bgold)"/>
        <path d="M-22,-26 h-12 a10 10 0 0 0 12 16 z M22,-26 h12 a10 10 0 0 1 -12 16 z" fill="url(#bgold)"/>
        <rect x="-5" y="-4" width="10" height="16" fill="#b9851a"/><rect x="-16" y="12" width="32" height="9" rx="3" fill="url(#bgold)"/>
        <text x="0" y="-8" font-family="Dela Gothic One" font-size="15" fill="#b81d3e" text-anchor="middle">1</text>
      </g>
      <g fill="#ffd84d">
        <path d="M150,38 l3,8 8,1 -6,6 2,8 -7,-4 -7,4 2,-8 -6,-6 8,-1z"/>
        <path d="M332,44 l2.4,6 6,.8 -4.6,4.6 1.4,6 -5.2,-3 -5.2,3 1.4,-6 -4.6,-4.6 6,-.8z"/>
      </g>
      <text x="240" y="113" text-anchor="middle" font-family="Dela Gothic One" font-size="29" fill="#000" opacity=".3">商品交換会</text>
      <text x="240" y="110" text-anchor="middle" font-family="Dela Gothic One" font-size="29" fill="url(#bgold)" stroke="#5a0a22" stroke-width="1">商品交換会</text>
      <text x="240" y="149" text-anchor="middle" font-family="Dela Gothic One" font-size="34" fill="#fff" stroke="#5a0a22" stroke-width="1.4">特別ルーレット</text>
      <text x="240" y="178" text-anchor="middle" font-family="Zen Maru Gothic" font-weight="900" font-size="13" fill="#ffe3a8" letter-spacing="3">SPECIAL PRIZE ROULETTE</text>
    </svg>
  </div>

  <!-- WHEEL -->
  <div class="wheel-wrap">
    <div class="aura"></div>
    <div class="wheel-ring"></div>
    <svg class="pointer" viewBox="0 0 60 70">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8197"/><stop offset="1" stop-color="#c00f38"/></linearGradient></defs>
      <path d="M30 66 L6 16 a24 14 0 0 1 48 0 Z" fill="#fff"/>
      <path d="M30 60 L11 18 a19 11 0 0 1 38 0 Z" fill="url(#pg)"/>
      <circle cx="30" cy="16" r="10" fill="#fff" stroke="#c00f38" stroke-width="3"/>
      <circle cx="30" cy="16" r="3.5" fill="#c00f38"/>
    </svg>
    <svg id="wheel" viewBox="0 0 400 400"></svg>
    <div class="gloss"></div>
    <div class="studs" id="studs"></div>
    <div class="hub"><span>抽</span></div>
  </div>

  <button class="spin-btn" id="spinBtn">ルーレットを回す</button>
  <div class="spin-hint">ボタンを押してスタート！</div>
  <button class="sound-toggle" id="soundToggle" aria-label="サウンド切替"></button>

  <!-- LEGEND -->
  <div class="legend">
    <h3>＼ 当選賞品ラインナップ ／</h3>
    <div id="legendBox"></div>
  </div>
</div>

<!-- RESULT MODAL -->
<div class="overlay" id="resultOverlay">
  <div class="result-card">
    <div class="rc-top" id="rcTop">
      <div class="rc-grade" id="rcGrade">1等</div>
      <div class="rc-sub" id="rcSub">おめでとうございます！</div>
      <svg class="rc-medal" id="rcMedal" viewBox="0 0 96 96"></svg>
    </div>
    <div class="rc-body">
      <div class="rc-label">当選賞品</div>
      <div class="rc-prize" id="rcPrize">—</div>
    </div>
    <button class="rc-close" id="rcClose">とじる</button>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="overlay" id="adminOverlay">
  <div class="admin-card">
    <h2>管理ページ</h2>
    <div class="ahint">賞品名・当選確率の変更／当選実績の確認<br>※賞品名と確率の両方が空欄の等級は「対象外」になります</div>

    <div class="asec-title">■ 賞品設定（1等〜5等＋参加賞）</div>
    <div id="adminFields"></div>

    <div class="total-line" id="totalLine"><span>有効な等級の確率合計</span><span class="v" id="totalVal">100%</span></div>

    <div class="abtns">
      <button class="aghost" id="adminReset">初期値に戻す</button>
      <button class="asave" id="adminSave">保存する</button>
    </div>

    <div class="asec-title" style="margin-top:22px">■ 当選実績（本数）</div>
    <div class="counts" id="countsBox"></div>
    <div class="csv-btns">
      <button class="acsv" id="csvBtn">CSVで出力</button>
      <button class="acount-reset" id="countsReset">実績をリセット</button>
    </div>

    <button class="aclose" id="adminClose">閉じる</button>
  </div>
</div>
<div class="saved-toast" id="toast">保存しました ✓</div>

<script>
/* ============================================================
   ルーレット：1等〜5等＋参加賞（最大6枠）
   ・賞品名＋確率の両方が入った等級だけが対象（扇形の角度＝確率）
   ・有効な等級の確率合計＝100% で保存可能
   ・当選実績はブラウザ保存／CSV出力対応
   ============================================================ */
const STORE_KEY='exchange_roulette_v3';
const COUNT_KEY='exchange_roulette_counts_v3';

const META=[
  { key:'g1', grade:'1等',  col:'#e11d48', col2:'#ff5170', txt:'#fff',    tag:'#e11d48', tagTxt:'#fff',    sanka:false },
  { key:'g2', grade:'2等',  col:'#ff8c1a', col2:'#ffb347', txt:'#fff',    tag:'#ff8c1a', tagTxt:'#fff',    sanka:false },
  { key:'g3', grade:'3等',  col:'#10c2c2', col2:'#5fe6e6', txt:'#fff',    tag:'#10c2c2', tagTxt:'#fff',    sanka:false },
  { key:'g4', grade:'4等',  col:'#7c5cfc', col2:'#b69cff', txt:'#fff',    tag:'#7c5cfc', tagTxt:'#fff',    sanka:false },
  { key:'g5', grade:'5等',  col:'#2bb673', col2:'#67e6a0', txt:'#fff',    tag:'#2bb673', tagTxt:'#fff',    sanka:false },
  { key:'gp', grade:'参加賞', col:'#ffe3a8', col2:'#fff0cf', txt:'#7a4a10', tag:'#e0c070', tagTxt:'#2b0712', sanka:true  },
];

// 初期値（4等・5等は空＝対象外。デフォルトで4枠表示）
const DEFAULTS={
  names:{ g1:'選べる高級グルメギフト', g2:'人気スイーツ詰め合わせ', g3:'オリジナルグッズ', g4:'', g5:'', gp:'ご参加ありがとうステッカー' },
  probs:{ g1:5, g2:10, g3:20, g4:0, g5:0, gp:65 }
};

let state=loadState();
let counts=loadCounts();

function blankNames(){return {g1:'',g2:'',g3:'',g4:'',g5:'',gp:''};}
function blankProbs(){return {g1:0,g2:0,g3:0,g4:0,g5:0,gp:0};}
function loadState(){
  try{const r=localStorage.getItem(STORE_KEY);if(r){const o=JSON.parse(r);
    return {names:Object.assign(blankNames(),o.names),probs:Object.assign(blankProbs(),o.probs)};}}catch(e){}
  return {names:Object.assign({},DEFAULTS.names),probs:Object.assign({},DEFAULTS.probs)};
}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function loadCounts(){try{const r=localStorage.getItem(COUNT_KEY);if(r)return Object.assign({g1:0,g2:0,g3:0,g4:0,g5:0,gp:0},JSON.parse(r));}catch(e){}return {g1:0,g2:0,g3:0,g4:0,g5:0,gp:0};}
function saveCounts(){try{localStorage.setItem(COUNT_KEY,JSON.stringify(counts));}catch(e){}}

/* 有効な等級（名前あり＆確率>0） */
function activeSegments(){
  return META.filter(m=>(state.names[m.key]||'').trim()!=='' && (state.probs[m.key]||0)>0)
             .map(m=>({...m, prob:state.probs[m.key], name:state.names[m.key], deg:state.probs[m.key]*3.6}));
}

/* 扇形（0°=上、時計回り） */
const CX=200,CY=200,R=192;
function pt(deg,r){const a=(deg-90)*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)];}
function arcPath(start,sweep){
  const [x1,y1]=pt(start,R),[x2,y2]=pt(start+sweep,R);
  if(sweep>=359.999){const [mx,my]=pt(start+180,R);
    return `M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 1 1 ${mx.toFixed(2)},${my.toFixed(2)} A${R},${R} 0 1 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;}
  const large=sweep>180?1:0;
  return `M${CX},${CY} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
}
function trim(t){t=t||'';return t.length>9?t.slice(0,8)+'…':t;}

function buildWheel(){
  const segs=activeSegments();
  const w=document.getElementById('wheel');
  let html=`<defs><radialGradient id="rim" cx="50%" cy="50%" r="50%"><stop offset="93%" stop-color="#fff0b8"/><stop offset="100%" stop-color="#b9851a"/></radialGradient></defs>
    <circle cx="200" cy="200" r="198" fill="url(#rim)"/>`;
  if(segs.length===0){
    html+=`<circle cx="200" cy="200" r="192" fill="#3a1530"/>
      <text x="200" y="205" text-anchor="middle" font-family="Zen Maru Gothic" font-size="16" fill="#caa">賞品を設定してください</text>`;
    w.innerHTML=html; buildStuds(); return;
  }
  let acc=0;
  segs.forEach((s,i)=>{
    html+=`<radialGradient id="g${i}" cx="50%" cy="50%" r="62%"><stop offset="0" stop-color="${s.col2}"/><stop offset="100%" stop-color="${s.col}"/></radialGradient>`;
    html+=`<path d="${arcPath(acc,s.deg)}" fill="url(#g${i})" stroke="#fff" stroke-width="2.5"/>`;
    const mid=acc+s.deg/2, rLabel=s.deg>=60?116:132, [lx,ly]=pt(mid,rLabel);
    let rot=mid; if(rot>90&&rot<270) rot+=180;
    const fs=s.deg<30?15:18, showName=s.deg>=30, gradeY=showName?-6:5;
    html+=`<g transform="translate(${lx.toFixed(1)},${ly.toFixed(1)}) rotate(${rot.toFixed(1)})">
      <text text-anchor="middle" y="${gradeY}" font-family="Dela Gothic One" font-size="${fs}" fill="${s.txt}" stroke="rgba(0,0,0,.18)" stroke-width=".6">${s.grade}</text>
      ${showName?`<text text-anchor="middle" y="16" font-family="Zen Maru Gothic" font-weight="700" font-size="11" fill="${s.txt}">${trim(s.name)}</text>`:''}
    </g>`;
    acc+=s.deg;
  });
  w.innerHTML=html; buildStuds();
}
function buildStuds(){
  const box=document.getElementById('studs');box.innerHTML='';
  for(let i=0;i<18;i++){const a=(i/18)*2*Math.PI;const d=document.createElement('div');d.className='stud';
    d.style.left=(50+47.5*Math.cos(a))+'%';d.style.top=(50+47.5*Math.sin(a))+'%';
    d.style.animation=`tw ${1+(i%4)*.25}s ease-in-out ${i*.07}s infinite alternate`;box.appendChild(d);}
}

function renderLegend(){
  const box=document.getElementById('legendBox');
  const segs=activeSegments();
  if(segs.length===0){box.innerHTML='<div style="text-align:center;color:#caa;font-size:13px;padding:8px 0 14px">賞品が未設定です</div>';return;}
  box.innerHTML=segs.map(s=>`
    <div class="lrow" style="background:linear-gradient(90deg,${s.col}30,transparent)">
      <div class="dot" style="background:linear-gradient(135deg,${s.col2},${s.col});color:${s.txt}">${s.sanka?'参':s.grade}</div>
      <div class="lname">${esc(s.name)}</div>
      <div class="lprob">${s.prob}%</div>
    </div>`).join('');
}
function esc(t){return (t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ====== サウンド（Web Audio APIで合成・外部ファイル不要） ====== */
const SOUND_KEY='exchange_roulette_sound_v1';
let soundOn=(localStorage.getItem(SOUND_KEY)!=='off');
let audioCtx=null, masterGain=null;
function ensureAudio(){
  if(!soundOn) return;
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    audioCtx=new AC();
    masterGain=audioCtx.createGain(); masterGain.gain.value=0.5; masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
/* ホイールと同じイージング cubic-bezier(.12,.62,.16,1) を再現 */
const easeWheel=(function(x1,y1,x2,y2){
  const A=(a,b)=>1-3*b+3*a,B=(a,b)=>3*b-6*a,C=a=>3*a;
  const calc=(t,a,b)=>((A(a,b)*t+B(a,b))*t+C(a))*t;
  const slope=(t,a,b)=>3*A(a,b)*t*t+2*B(a,b)*t+C(a);
  return function(x){let t=x;for(let i=0;i<6;i++){const s=slope(t,x1,x2);if(!s)break;t-=(calc(t,x1,x2)-x)/s;}return calc(t,y1,y2);};
})(.12,.62,.16,1);

function tickAt(time){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(1080+Math.random()*160,time);
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(0.22,time+0.001);
  g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
  o.connect(g).connect(masterGain); o.start(time); o.stop(time+0.06);
}
/* 回転量に応じてカチカチ音を予約（減速で間隔が広がる） */
function scheduleTicks(deltaDeg,durSec){
  if(!soundOn||!audioCtx) return;
  const pegAngle=15, t0=audioCtx.currentTime, steps=Math.ceil(durSec/0.006);
  let lastPeg=0;
  for(let i=1;i<=steps;i++){
    const x=i/steps, ang=deltaDeg*easeWheel(x), peg=Math.floor(ang/pegAngle);
    if(peg>lastPeg){
      const tt=t0+x*durSec, n=Math.min(peg-lastPeg,4);
      for(let k=0;k<n;k++) tickAt(tt+k*0.012);
      lastPeg=peg;
    }
  }
}
function note(t,freq,dur,type,vol){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(masterGain); o.start(t); o.stop(t+dur+0.05);
}
function playLaunch(){
  if(!soundOn||!audioCtx) return;
  const t=audioCtx.currentTime, o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(640,t+0.18);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(g).connect(masterGain); o.start(t); o.stop(t+0.25);
}
function playWin(){
  if(!soundOn||!audioCtx) return;
  const t0=audioCtx.currentTime, notes=[523.25,659.25,783.99,1046.5];
  notes.forEach((f,i)=>{const t=t0+i*0.11; note(t,f,0.28,'square',0.2); note(t,f*2,0.2,'sine',0.06);});
  note(t0+0.45,1318.5,0.55,'triangle',0.18); note(t0+0.45,1567.98,0.55,'sine',0.1);
}
function playSanka(){
  if(!soundOn||!audioCtx) return;
  const t0=audioCtx.currentTime;
  note(t0,392,0.22,'sine',0.26); note(t0+0.16,523.25,0.5,'sine',0.26);
}
const ICON_ON='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.6 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.6 7-8.8s-3-7.8-7-8.8z"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M22 9.4 20.6 8 18 10.6 15.4 8 14 9.4 16.6 12 14 14.6 15.4 16 18 13.4 20.6 16 22 14.6 19.4 12 22 9.4z"/></svg>';
function updateSoundBtn(){
  const b=document.getElementById('soundToggle');
  b.classList.toggle('off',!soundOn);
  b.innerHTML=(soundOn?ICON_ON:ICON_OFF)+'<span>サウンド '+(soundOn?'ON':'OFF')+'</span>';
}
document.getElementById('soundToggle').addEventListener('click',()=>{
  soundOn=!soundOn; localStorage.setItem(SOUND_KEY,soundOn?'on':'off'); updateSoundBtn();
  if(soundOn){ ensureAudio(); setTimeout(()=>{ if(audioCtx) note(audioCtx.currentTime,660,0.16,'sine',0.25); },50); }
});

/* 抽選＆回転 */
let rot=0,spinning=false;
const wheel=document.getElementById('wheel'),spinBtn=document.getElementById('spinBtn');
function spin(){
  if(spinning) return;
  const segs=activeSegments();
  if(segs.length===0){toast('賞品が設定されていません','err');return;}
  spinning=true;spinBtn.disabled=true;
  ensureAudio(); playLaunch();
  const total=segs.reduce((s,x)=>s+x.deg,0); // ≈360
  const a=Math.random()*total;
  let accDeg=0,winner=segs[segs.length-1];
  for(const s of segs){if(a<accDeg+s.deg){winner=s;break;}accDeg+=s.deg;}
  const incr=((-a-(rot%360))%360+360)%360 + 360*6;
  rot += incr;
  wheel.style.transform=`rotate(${rot}deg)`;
  scheduleTicks(incr,5.6);
  setTimeout(()=>{recordWin(winner.key);showResult(winner);spinning=false;spinBtn.disabled=false;},5700);
}
function recordWin(key){counts[key]=(counts[key]||0)+1;saveCounts();}

/* 結果 */
function medalSVG(s){
  return `<defs><radialGradient id="m" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="${s.col2}"/><stop offset="100%" stop-color="${s.col}"/></radialGradient></defs>
    <circle cx="48" cy="48" r="40" fill="url(#m)" stroke="#fff" stroke-width="4"/>
    <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="48" y="60" text-anchor="middle" font-family="Dela Gothic One" font-size="30" fill="${s.txt}">${s.sanka?'参':s.grade[0]}</text>
    <path d="M30 84 l-8 10 12 -2 4 8 8 -16z M66 84 l8 10 -12 -2 -4 8 -8 -16z" fill="${s.col}" stroke="#fff" stroke-width="2"/>`;
}
function showResult(s){
  document.getElementById('rcTop').style.background=`linear-gradient(180deg,${s.col2},${s.col})`;
  document.getElementById('rcGrade').textContent=s.grade;
  document.getElementById('rcSub').textContent=s.sanka?'ご参加ありがとうございます！':'おめでとうございます！';
  document.getElementById('rcMedal').innerHTML=medalSVG(s);
  const pr=document.getElementById('rcPrize');pr.textContent=s.name;pr.style.color=s.col;
  document.getElementById('resultOverlay').classList.add('show');
  if(!s.sanka){ confetti(); playWin(); } else { playSanka(); }
}
function confetti(){
  const colors=['#ffd84d','#e11d48','#10c2c2','#7c5cfc','#2bb673','#ff8c1a','#fff'];
  for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=colors[i%colors.length];
    c.style.animation=`fall ${1.8+Math.random()*1.8}s linear ${Math.random()*.6}s forwards`;
    c.style.transform=`translateY(0) rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}
}

/* 管理ページ：賞品入力欄を生成 */
function buildAdminFields(){
  const box=document.getElementById('adminFields');
  box.innerHTML=META.map(m=>`
    <div class="afield" data-key="${m.key}">
      <div class="top">
        <span class="tag" style="background:${m.tag};color:${m.tagTxt}">${m.grade}</span>
        <span class="lab">賞品名 ／ 当選確率</span>
        <span class="opt">${m.sanka?'（はずれ用）':'（任意）'}</span>
      </div>
      <div class="arow">
        <input class="name" id="in_${m.key}" type="text" maxlength="40" placeholder="${m.grade}の賞品名（空欄＝対象外）">
        <div class="prob-wrap"><input class="prob" id="pr_${m.key}" type="number" min="0" max="100" inputmode="numeric" placeholder="0"></div>
      </div>
    </div>`).join('');
  META.forEach(m=>document.getElementById('pr_'+m.key).addEventListener('input',updateTotal));
  META.forEach(m=>document.getElementById('in_'+m.key).addEventListener('input',updateTotal));
}

let tapCount=0,tapTimer=null;
document.getElementById('banner').addEventListener('click',()=>{
  tapCount++;clearTimeout(tapTimer);tapTimer=setTimeout(()=>{tapCount=0;},2000);
  if(tapCount>=5){tapCount=0;openAdmin();}
});
function openAdmin(){
  META.forEach(m=>{
    document.getElementById('in_'+m.key).value=state.names[m.key]||'';
    document.getElementById('pr_'+m.key).value=(state.probs[m.key]||0)>0?state.probs[m.key]:'';
  });
  updateTotal();renderCounts();
  document.getElementById('adminOverlay').classList.add('show');
}
function readField(m){
  const name=document.getElementById('in_'+m.key).value.trim();
  const pv=parseInt(document.getElementById('pr_'+m.key).value,10);
  const prob=isNaN(pv)?0:Math.max(0,Math.min(100,pv));
  return {name,prob,hasName:name!=='',hasProb:prob>0};
}
function updateTotal(){
  let t=0;META.forEach(m=>{const f=readField(m);if(f.hasName&&f.hasProb)t+=f.prob;});
  const line=document.getElementById('totalLine'),v=document.getElementById('totalVal');
  v.textContent=t+'%';line.classList.toggle('ok',t===100);line.classList.toggle('ng',t!==100);
  return t;
}

function renderCounts(){
  const box=document.getElementById('countsBox');
  let total=0,rows='',shown=0;
  META.forEach(m=>{
    const n=counts[m.key]||0;
    const active=(state.names[m.key]||'').trim()!==''&&(state.probs[m.key]||0)>0;
    if(active||n>0){
      shown++;total+=n;
      rows+=`<div class="crow"><div class="cg"><span class="tag" style="background:${m.tag};color:${m.tagTxt}">${m.grade}</span>${esc(state.names[m.key]||'(未設定)')}</div>
        <div class="cn">${n}<small>本</small></div></div>`;
    }
  });
  if(shown===0) rows='<div class="crow empty">まだ当選記録がありません</div>';
  else rows+=`<div class="crow total"><div class="cg">合計</div><div class="cn">${total}<small>回</small></div></div>`;
  box.innerHTML=rows;
}

/* CSV出力 */
function pad(n){return ('0'+n).slice(-2);}
function csvCell(v){v=String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){
  const d=new Date();
  const stamp=`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  let lines=[['商品交換会特別ルーレット 当選実績'],['出力日時',stamp],[],['等級','賞品名','当選本数']];
  let total=0;
  META.forEach(m=>{
    const n=counts[m.key]||0;
    const active=(state.names[m.key]||'').trim()!==''&&(state.probs[m.key]||0)>0;
    if(active||n>0){lines.push([m.grade,state.names[m.key]||'',n]);total+=n;}
  });
  lines.push(['合計','',total]);
  const csv=lines.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`当選実績_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('CSVを出力しました ✓','ok');
}

function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='saved-toast show '+(type||'ok');setTimeout(()=>t.classList.remove('show'),1800);}

/* events */
spinBtn.addEventListener('click',spin);
document.getElementById('rcClose').addEventListener('click',()=>document.getElementById('resultOverlay').classList.remove('show'));

document.getElementById('adminSave').addEventListener('click',()=>{
  let activeCount=0,partial=null,total=0;
  for(const m of META){
    const f=readField(m);
    if(f.hasName&&f.hasProb){activeCount++;total+=f.prob;}
    else if(f.hasName||f.hasProb){partial=m.grade;break;}
  }
  if(partial){toast(partial+'：賞品名と確率の両方を入力してください','err');return;}
  if(activeCount===0){toast('少なくとも1つの等級を設定してください','err');return;}
  if(total!==100){toast('有効な等級の確率合計を100%に（現在 '+total+'%）','err');return;}
  const names=blankNames(),probs=blankProbs();
  META.forEach(m=>{const f=readField(m);if(f.hasName&&f.hasProb){names[m.key]=f.name;probs[m.key]=f.prob;}});
  state.names=names;state.probs=probs;saveState();
  buildWheel();renderLegend();
  document.getElementById('adminOverlay').classList.remove('show');
  toast('保存しました ✓','ok');
});
document.getElementById('adminReset').addEventListener('click',()=>{
  META.forEach(m=>{document.getElementById('in_'+m.key).value=DEFAULTS.names[m.key]||'';
    document.getElementById('pr_'+m.key).value=(DEFAULTS.probs[m.key]||0)>0?DEFAULTS.probs[m.key]:'';});
  updateTotal();
});
document.getElementById('csvBtn').addEventListener('click',exportCSV);
document.getElementById('countsReset').addEventListener('click',()=>{
  if(confirm('当選実績の本数をすべて0に戻します。よろしいですか？')){
    counts={g1:0,g2:0,g3:0,g4:0,g5:0,gp:0};saveCounts();renderCounts();toast('実績をリセットしました','ok');}
});
document.getElementById('adminClose').addEventListener('click',()=>document.getElementById('adminOverlay').classList.remove('show'));

/* init */
buildAdminFields();buildWheel();renderLegend();updateSoundBtn();
</script>
</body>
</html>
